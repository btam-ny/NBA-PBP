name: Update NBA play-by-play

on:
  schedule:
    # Hourly from 03:15 to 08:15 UTC: roughly 11 PM-4 AM Eastern, as games finish
    - cron: "15 3-8 * * *"
    # Midday catch-up for anything that wasn't final overnight
    - cron: "15 16 * * *"
  workflow_dispatch: # "Run workflow" button in the Actions tab

concurrency:
  group: nba-pbp
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/nba_pbp.py update
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
